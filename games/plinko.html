<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📈 Plinko — Cassino Inova</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.plinko-board{width:min(420px,95vw);margin:0 auto;background:var(--card);border-radius:16px;padding:16px;border:2px solid var(--border)}
canvas{width:100%;border-radius:12px}
.multiplier-row{display:flex;justify-content:center;gap:4px;margin-top:10px}
.mult-chip{padding:4px 8px;border-radius:6px;font-size:.68rem;font-weight:700;font-family:'Poppins'}
</style></head><body>

<header class="game-header">
  <a class="logo" onclick="goHome()">← 🐯 Cassino Inova</a>
  <div class="right"><div class="balance-pill" id="balancePill">—</div></div>
</header>

<div class="game-area" style="max-width:500px;">
  <div class="bet-row">
    <button class="bet-btn" onclick="adjustBet(-1)">−</button>
    <span class="bet-display" id="betDisplay">R$ 10</span>
    <button class="bet-btn" onclick="adjustBet(1)">+</button>
  </div>

  <div class="plinko-board">
    <canvas id="plinkoCanvas"></canvas>
    <div class="multiplier-row" id="multRow"></div>
  </div>

  <br><button class="action-btn" id="dropBtn" onclick="dropBall()">Soltar 📈</button>
  <div class="result-banner" id="resultBanner"></div>
</div>

<script src="shared.js"></script>
<script>
let balance=getBalance(),bet=10,balls=[],pins=[];
const ROWS=12,MULTS=[8.9,3,1.4,1.1,0.7,0.5,0.2,0.5,0.7,1.1,1.4,3,8.9];
const betLevels=[5,10,25,50,100];
function updateBal(){setBalance(balance);document.getElementById('balancePill').textContent=fmt(balance)}
function adjustBet(d){const i=betLevels.indexOf(bet);bet=betLevels[Math.max(0,Math.min(betLevels.length-1,i+d))];document.getElementById('betDisplay').textContent=fmt(bet)}

function buildMultRow(){
  const row=document.getElementById('multRow');
  row.innerHTML='';
  MULTS.forEach(m=>{
    const chip=document.createElement('span');
    chip.className='mult-chip';
    chip.style.background=m>=2?'rgba(76,175,80,.15)':'rgba(229,57,53,.15)';
    chip.style.color=m>=2?'var(--green)':'var(--red)';
    chip.textContent=m+'x';
    row.appendChild(chip);
  });
}

function initBoard(){
  pins=[];balls=[];
  for(let row=0;row<ROWS;row++){
    for(let col=0;col<=row;col++){
      const x=col*(W/(ROWS+1))+(W/(ROWS+1))/2+(ROWS-row)*(W/(ROWS+1))/2;
      pins.push({x,row});
    }
  }
}

const canvas=document.getElementById('plinkoCanvas');
const ctx=canvas.getContext('2d');
const W=400,H=500;
canvas.width=W;canvas.height=H;

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#14141e';ctx.fillRect(0,0,W,H);
  // Pins
  pins.forEach(p=>{
    const y=p.row*(H-80)/ROWS+40;
    ctx.beginPath();ctx.arc(p.x,y,3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fill();
  });
  // Balls
  balls.forEach((b,i)=>{
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle=b.color||'#ffd54f';ctx.fill();
    b.vy+=0.15;b.y+=b.vy;b.x+=b.vx;
    if(Math.random()<.06)b.vx+=(Math.random()-.5)*.08;
    b.vx*=.99;
    if(b.y>H-60&&!b.done){
      b.done=true;
      const slot=Math.floor(b.x/W*MULTS.length);
      const mult=MULTS[Math.max(0,Math.min(MULTS.length-1,slot))];
      resolveBall(i,mult);
    }
  });
  requestAnimationFrame(draw);
}

function dropBall(){
  if(balance<bet){showToast('Saldo insuficiente!','error');return}
  balance-=bet;updateBal();
  document.getElementById('resultBanner').className='result-banner';
  const colors=['#ffd54f','#e53935','#4caf50','#42a5f5','#ab47bc'];
  balls.push({
    x:W/2+(Math.random()-.5)*20,
    y:20,
    vx:(Math.random()-.5)*.5,
    vy:0,
    r:6,
    color:colors[Math.floor(Math.random()*colors.length)],
    betAmount:bet
  });
  beep(600,.05);
}

function resolveBall(idx,mult){
  const ball=balls[idx];
  const won=Math.floor(ball.betAmount*mult);
  if(mult>=1){balance+=won;setBalance(balance)}
  if(mult>=3){
    playWin(true);
    document.getElementById('resultBanner').className='result-banner result-win';
    document.getElementById('resultBanner').textContent=`🎉 ${mult}x — Ganhou ${fmt(won)}!`;
  }else if(mult>=1){
    beep(500,.1,'triangle',.06);
  }else{
    beep(200,.1,'sine',.04);
    document.getElementById('resultBanner').className='result-banner result-lose';
    document.getElementById('resultBanner').textContent=`${mult}x — Perdeu ${fmt(ball.betAmount-won)}`;
  }
  setTimeout(()=>{if(balls.length>0)balls.shift()},100);
}

buildMultRow();initBoard();draw();updateBal();
</script></body></html>
