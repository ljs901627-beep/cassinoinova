<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎡 Roleta — Cassino Inova</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.wheel-wrap{position:relative;width:min(340px,90vw);margin:0 auto 24px}
.wheel{width:100%;aspect-ratio:1;border-radius:50%;border:6px solid var(--gold-dark);position:relative;transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
.pocket{position:absolute;width:50%;height:1px;top:50%;left:50%;transform-origin:left center}
.ball{position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:10%;left:calc(50% - 7px);z-index:5;box-shadow:0 0 8px rgba(255,255,255,.6)}
.pointer{position:absolute;top:-14px;left:calc(50% - 12px);font-size:24px;z-index:10}
.result-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Cinzel',serif;font-size:2.2rem;font-weight:900;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:none}
.bet-areas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.bet-area{padding:10px 18px;border-radius:10px;border:2px solid var(--border);cursor:pointer;font-family:'Poppins';font-size:.85rem;font-weight:600;color:var(--text);background:var(--card);transition:all .2s;text-align:center}
.bet-area:hover{border-color:var(--gold)}
.bet-area.selected{border-color:var(--gold)!important;background:rgba(255,213,79,.15)!important}
.bet-red{border-color:#e53935!important}.bet-black{border-color:rgba(255,255,255,.3)!important}
.bet-green{border-color:#4caf50!important}
.numbers-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:16px}
.num-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;cursor:pointer;border:none;font-family:'Poppins';color:#fff;transition:all .15s}
.num-cell:hover{transform:scale(1.08)}
.num-cell.selected{outline:3px solid var(--gold)}
.red{background:#c62828}.black{background:#212121}.green{background:#2e7d32}
</style></head><body>

<header class="game-header">
  <a class="logo" onclick="goHome()">← 🐯 Cassino Inova</a>
  <div class="right"><div class="balance-pill" id="balancePill">—</div></div>
</header>

<div class="game-area">
  <div class="wheel-wrap">
    <div class="pointer">▼</div>
    <div class="wheel" id="wheel"></div>
    <div class="ball" id="ball"></div>
    <div class="result-num" id="resultNum"></div>
  </div>

  <div class="bet-row">
    <button class="bet-btn" onclick="adjustBet(-1)">−</button>
    <span class="bet-display" id="betDisplay">R$ 10</span>
    <button class="bet-btn" onclick="adjustBet(1)">+</button>
  </div>

  <div class="bet-areas">
    <button class="bet-area bet-red" data-bet="red">🔴 Vermelho (2x)</button>
    <button class="bet-area bet-black" data-bet="black">⚫ Preto (2x)</button>
    <button class="bet-area bet-green" data-bet="green">🟢 Verde (14x)</button>
    <button class="bet-area" data-bet="even">Par (2x)</button>
    <button class="bet-area" data-bet="odd">Ímpar (2x)</button>
  </div>

  <div class="numbers-grid" id="numbersGrid"></div>
  <br><button class="action-btn" id="spinBtn" onclick="spin()">Girar 🎡</button>
  <div class="result-banner" id="resultBanner"></div>
</div>

<script src="shared.js"></script>
<script>
const RED_NUMS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const BLACK_NUMS=[2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35];
const WHEEL_ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
let balance=getBalance(),bet=10,bets=[],selectedNumber=null;
const betLevels=[5,10,25,50,100,250];

function updateBal(){setBalance(balance);document.getElementById('balancePill').textContent=fmt(balance)}

function buildWheel(){
  const w=document.getElementById('wheel');
  const seg=360/37;
  WHEEL_ORDER.forEach((num,i)=>{
    const p=document.createElement('div');p.className='pocket';
    p.style.transform=`rotate(${i*seg}deg)`;
    const color=num===0?'#2e7d32':RED_NUMS.includes(num)?'#c62828':'#212121';
    p.innerHTML=`<div style="position:absolute;top:-46px;left:-14px;width:28px;height:28px;background:${color};clip-path:polygon(50% 0%,100% 100%,0% 100%);display:flex;align-items:center;justify-content:center;font-size:.55rem;color:#fff;">${num}</div>`;
    w.appendChild(p);
  });
}

function buildNumbers(){
  const grid=document.getElementById('numbersGrid');
  for(let i=0;i<=36;i++){
    const btn=document.createElement('button');
    btn.className='num-cell '+(i===0?'green':RED_NUMS.includes(i)?'red':'black');
    btn.textContent=i;btn.onclick=()=>selectNumber(i);
    grid.appendChild(btn);
  }
}

function selectNumber(n){selectedNumber=n;document.querySelectorAll('.num-cell').forEach(c=>c.classList.remove('selected'));event.target.classList.add('selected')}
function adjustBet(d){const idx=betLevels.indexOf(bet);bet=betLevels[Math.max(0,Math.min(betLevels.length-1,(idx<0?1:idx)+d))];document.getElementById('betDisplay').textContent=fmt(bet)}

let spinning=false;
async function spin(){
  if(spinning)return;if(balance<bet){showToast('Saldo insuficiente!','error');return}
  if(!document.querySelector('.bet-area.selected')&&selectedNumber===null){showToast('Escolha uma aposta!','error');return}
  spinning=true;document.getElementById('spinBtn').disabled=true;
  balance-=bet;updateBal();

  let totalMult=0;
  document.querySelectorAll('.bet-area.selected').forEach(b=>{bets.push({type:b.dataset.bet})});
  if(selectedNumber!==null)bets.push({type:'number',value:selectedNumber});

  const resultIdx=Math.floor(Math.random()*37);
  const result=WHEEL_ORDER[resultIdx];
  bets.forEach(b=>{
    if(b.type==='red'&&result!==0&&RED_NUMS.includes(result))totalMult+=2;
    if(b.type==='black'&&result!==0&&BLACK_NUMS.includes(result))totalMult+=2;
    if(b.type==='green'&&result===0)totalMult+=14;
    if(b.type==='even'&&result!==0&&result%2===0)totalMult+=2;
    if(b.type==='odd'&&result%2===1)totalMult+=2;
    if(b.type==='number'&&b.value===result)totalMult+=36;
  });

  const wheel=document.getElementById('wheel');
  const currentRotation=parseInt(wheel.dataset.rot||'0');
  const newRot=currentRotation+1440+(resultIdx*(360/37))+Math.random()*20;
  wheel.style.transform=`rotate(${newRot}deg)`;wheel.dataset.rot=newRot;
  beep(200,.1,'sawtooth',.06);

  await new Promise(r=>setTimeout(r,4200));

  document.getElementById('resultNum').textContent=result;
  const banner=document.getElementById('resultBanner');

  if(totalMult>0){
    const winnings=bet*totalMult;
    balance+=winnings;setBalance(balance);
    playWin(totalMult>=14);
    banner.className='result-banner result-win';
    banner.textContent=`🎉 ${result} — Ganhou ${fmt(winnings)} (${totalMult}x)!`;
  }else{
    playLose();
    banner.className='result-banner result-lose';
    banner.textContent=`${result} — Não foi dessa vez!`;
  }

  bets=[];selectedNumber=null;
  document.querySelectorAll('.bet-area.selected,.num-cell.selected').forEach(el=>el.classList.remove('selected'));
  updateBal();spinning=false;document.getElementById('spinBtn').disabled=false;

  setTimeout(()=>{document.getElementById('resultNum').textContent=''},3000);
}

document.querySelectorAll('.bet-area').forEach(btn=>btn.addEventListener('click',()=>btn.classList.toggle('selected')));

buildWheel();buildNumbers();updateBal();
</script></body></html>
