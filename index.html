<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐯 Cassino Inova — Todos os Jogos</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd54f;--gd:#c8961e;--red:#e53935;--bg:#0a0a12;--card:#14141e;--green:#4caf50;--text:#f5f5f5;--bd:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 30%,#1a1a2e 0%,var(--bg) 70%);min-height:100vh;font-family:'Poppins',sans-serif;color:var(--text)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:linear-gradient(135deg,#1a0a00,#2d1810);border-bottom:2px solid var(--gd)}
.logo{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;color:var(--gold);letter-spacing:1px}
.bal{background:linear-gradient(135deg,rgba(255,213,79,.15),rgba(255,213,79,.05));border:1px solid var(--gd);border-radius:10px;padding:6px 16px;font-family:'Cinzel',serif;font-weight:700;color:var(--gold)}
.uchip{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.05);border-radius:8px;padding:6px 12px;border:1px solid var(--bd)}
.uchip span{font-size:.78rem;color:var(--gold);font-weight:600}
.out{background:none;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 8px;color:rgba(255,255,255,.4);cursor:pointer;font-size:.68rem;font-family:'Poppins'}
.main{max-width:1100px;margin:0 auto;padding:24px}
.sec{font-family:'Cinzel',serif;color:var(--gold);font-size:1.15rem;margin:24px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;text-decoration:none;display:block;transition:.25s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(200,150,30,.12);border-color:var(--gd)}
.banner{height:120px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.info{padding:14px 16px}
.gname{font-family:'Cinzel',serif;font-weight:700;font-size:.92rem;color:var(--text)}
.gdesc{font-size:.74rem;opacity:.45;margin-top:2px;line-height:1.35}
.tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:var(--gold);font-size:.62rem;padding:3px 9px;border-radius:16px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;z-index:2}
.ftr{text-align:center;padding:14px;border-top:1px solid var(--bd);margin-top:32px}
.ftr a{color:rgba(255,213,79,.35);text-decoration:none;font-size:.72rem}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.hdr{flex-direction:column;gap:8px}}
</style></head><body>

<header class="hdr">
  <div class="logo">🐯 CASSINO INOVA</div>
  <div style="display:flex;gap:10px;align-items:center;">
    <div class="bal" id="bal">—</div>
    <div class="uchip"><span id="uname"></span><button class="out" onclick="doLogout()">Sair</button></div>
  </div>
</header>

<main class="main">
  <h2 class="sec">🔥 Populares</h2>
  <div class="grid" id="popGrid"></div>
  <h2 class="sec">🎮 Todos os Jogos</h2>
  <div class="grid" id="allGrid"></div>
</main>

<footer class="ftr"><a href="https://cassinoinova.guibut" target="_blank">🌐 cassinoinova.guibut</a></footer>

<script>
const SK='tc_session',UK='tc_users';
const user=localStorage.getItem(SK);
if(!user)window.location.href='login.html';

function getUsers(){try{return JSON.parse(localStorage.getItem(UK))||{}}catch{return{}}}
function fmt(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v)}
function getBal(){const u=getUsers();return u[user]?.balance||0}
function doLogout(){localStorage.removeItem(SK);window.location.href='login.html'}

const GAMES=[
  {f:'tiger',e:'🐯',n:'Fortune Tiger',d:'Jogo do tigrinho! Gire e ganhe até 50x.',t:'Popular',b:'linear-gradient(135deg,#b71c1c,#d32f2f)',pop:true},
  {f:'crash',e:'🚀',n:'Crash',d:'Saque antes de explodir!',t:'Ao Vivo',b:'linear-gradient(135deg,#1a237e,#283593)',pop:true},
  {f:'mines',e:'💣',n:'Mines',d:'Encontre 💎 evite 💣!',t:'Popular',b:'linear-gradient(135deg,#1b5e20,#2e7d32)',pop:true},
  {f:'roleta',e:'🎡',n:'Roleta',d:'Números, cores e pares.',t:'Clássico',b:'linear-gradient(135deg,#b71c1c,#880e4f)'},
  {f:'blackjack',e:'🃏',n:'Blackjack',d:'Chegue perto do 21.',t:'Cartas',b:'linear-gradient(135deg,#1b5e20,#004d40)'},
  {f:'plinko',e:'📈',n:'Plinko',d:'Solte a bolinha e multiplique!',t:'Arcade',b:'linear-gradient(135deg,#4a148c,#7b1fa2)'},
  {f:'dice',e:'🎲',n:'Dados',d:'Over ou under?',t:'Rápido',b:'linear-gradient(135deg,#bf360c,#e64a19)'},
  {f:'coinflip',e:'🪙',n:'Coin Flip',d:'Cara ou coroa? 2x!',t:'Instantâneo',b:'linear-gradient(135deg,#f57f17,#ff8f00)'},
  {f:'chicken',e:'🐔',n:'Chicken Cross',d:'Atravesse sem ser atingido!',t:'Skill',b:'linear-gradient(135deg,#006064,#0097a7)'},
];

function render(){
  const pg=document.getElementById('popGrid'),ag=document.getElementById('allGrid');
  pg.innerHTML='';ag.innerHTML='';
  GAMES.forEach(g=>{
    const c=document.createElement('a');
    c.className='card';c.href=`games/${g.f}.html`;
    c.innerHTML=`<span class="tag">${g.t}</span><div class="banner" style="background:${g.b}">${g.e}</div><div class="info"><div class="gname">${g.n}</div><div class="gdesc">${g.d}</div></div>`;
    (g.pop?pg:ag).appendChild(c);
  });
}

document.getElementById('uname').textContent=user;
document.getElementById('bal').textContent=fmt(getBal());
render();
setInterval(()=>{document.getElementById('bal').textContent=fmt(getBal())},2000);
</script>
</body></html>
